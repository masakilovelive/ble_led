name: ble_led_endurance_app
description: Android BLE endurance app for Stock A/B stress sweeps
publish_to: "none"
version: 0.1.3+4
environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  flutter_reactive_ble: ^5.0.3
  permission_handler: ^11.3.1
  logger: ^2.4.0
  flutter_colorpicker: ^1.0.3
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  usb_serial: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
